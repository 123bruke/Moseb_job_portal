name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest -q            # unit tests + agent evals (ranking accuracy gate) + coverage gate

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci

  integration:
    runs-on: ubuntu-latest
    needs: [backend]
    services:
      redis: { image: "redis:7-alpine", ports: ["6379:6379"] }
      chromadb: { image: "chromadb/chroma:0.5.23", ports: ["8000:8000"] }
      neo4j:
        image: neo4j:5.24
        ports: ["7687:7687"]
        env: { NEO4J_AUTH: neo4j/ci-password }
    env:
      REDIS_URL: redis://localhost:6379/0
      CHROMA_HOST: localhost
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: ci-password
      GEMINI_API_KEY: ""            # Gemini is mocked in tests; the heuristic fallbacks run
      SUPABASE_JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: cd backend && pip install -e ".[dev]" && pytest -q -m integration --no-cov

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t srv2-backend .
      - run: docker build -t srv2-frontend frontend
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: srv2-backend, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: srv2-frontend, severity: "CRITICAL,HIGH", exit-code: "1", ignore-unfixed: true }
