name: cd
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: { contents: read, packages: write }
env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs: { tag: "${{ steps.meta.outputs.tag }}" }
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          docker build -f backend/Dockerfile -t $REGISTRY/backend:${{ steps.meta.outputs.tag }} .
          docker build -t $REGISTRY/frontend:${{ steps.meta.outputs.tag }} \
            --build-arg VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }} frontend
          docker push $REGISTRY/backend:${{ steps.meta.outputs.tag }}
          docker push $REGISTRY/frontend:${{ steps.meta.outputs.tag }}

  staging:
    if: github.ref == 'refs/heads/main'
    needs: build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.STAGING_HOST }}
          ssh_key: ${{ secrets.STAGING_SSH_KEY }}
          tag: ${{ needs.build-push.outputs.tag }}
          database_url: ${{ secrets.STAGING_DATABASE_URL }}
          base_url: ${{ vars.STAGING_URL }}
      - name: Smoke tests
        run: |
          curl -fsS ${{ vars.STAGING_URL }}/api/health
          curl -fsS ${{ vars.STAGING_URL }}/api/ready
          curl -fsS ${{ vars.STAGING_URL }}/ | grep -qi "<div id=\"root\""

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-push
    runs-on: ubuntu-latest
    environment: production        # required reviewers = manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy
        with:
          host: ${{ secrets.PROD_HOST }}
          ssh_key: ${{ secrets.PROD_SSH_KEY }}
          tag: ${{ needs.build-push.outputs.tag }}
          database_url: ${{ secrets.PROD_DATABASE_URL }}
          base_url: ${{ vars.PROD_URL }}
