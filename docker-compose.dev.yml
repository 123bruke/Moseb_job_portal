# Dev overrides: hot reload + exposed ports for local tooling.
services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/app", "./data:/data:ro"]
    ports: ["8000:8000"]
    environment: { ENV: dev }
  worker:
    volumes: ["./backend:/app", "./data:/data:ro"]
  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host 0.0.0.0
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
  redis: { ports: ["6379:6379"] }
  chromadb: { ports: ["8001:8000"] }
  neo4j: { ports: ["7474:7474", "7687:7687"] }
