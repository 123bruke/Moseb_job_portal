[project]
name = "smart-resume-backend"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9",
  "pydantic>=2.7", "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2", "alembic>=1.13", "sqlalchemy>=2.0",
  "pyjwt>=2.8", "httpx>=0.27",
  "chromadb-client>=0.5.23", "neo4j>=5.24", "redis>=5.0", "rq>=1.16",
  "langgraph>=0.2", "langchain-core>=0.3",
  "pymupdf>=1.24", "pytesseract>=0.3.10", "pillow>=10.3", "python-docx>=1.1",
  "reportlab>=4.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
yolo = ["ultralytics>=8.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "fakeredis>=2.23"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not integration" --cov=app --cov-fail-under=50'
markers = ["integration: needs the docker compose test stack"]
